name: Draft release
on:
  workflow_dispatch:
    inputs:
      immutable_releases_confirmed:
        description: Confirm immutable releases are enabled in repository settings
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: draft-release
  cancel-in-progress: false
jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
      - run: python3 .github/scripts/tools.py gitleaks
      - run: python3 .github/scripts/secrets.py --history
      - run: npm run check:package
        env:
          WAPENTAKE_PACKAGE_DIR: ${{ runner.temp }}/wapentake-release
      - name: Create draft with verified archive and checksums
        run: node .github/scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          IMMUTABLE_RELEASES_CONFIRMED: ${{ inputs.immutable_releases_confirmed }}
          WAPENTAKE_PACKAGE_DIR: ${{ runner.temp }}/wapentake-release
