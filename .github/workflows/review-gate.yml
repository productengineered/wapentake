name: Review gate
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  status:
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: review-gate
  cancel-in-progress: false
jobs:
  review:
    if: >-
      github.event_name != 'status' && github.event_name != 'issue_comment' ||
      github.event_name == 'status' && github.event.context == 'CodeRabbit' ||
      github.event_name == 'issue_comment' && github.event.issue.pull_request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      statuses: write
    steps:
      # Only execute trusted default-branch policy, including on manual dispatch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
      - run: node .github/scripts/review-gate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
